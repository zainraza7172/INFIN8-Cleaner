
name: INFIN8 Cleaner APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android source
        shell: bash
        run: |
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            if [ ! -f "INFIN8-Cleaner-GitHub-Source.zip" ]; then
              echo "ERROR: Source ZIP not found."
              exit 1
            fi

            mkdir -p _source
            unzip -oq INFIN8-Cleaner-GitHub-Source.zip -d _source
          fi

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR="."

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            FOUND=$(find _source -maxdepth 5 \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -print -quit)

            if [ -z "$FOUND" ]; then
              echo "ERROR: Gradle settings file not found."
              find _source -maxdepth 5 -type f | sort
              exit 1
            fi

            PROJECT_DIR=$(dirname "$FOUND")
          fi

          echo "Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INFIN8-Cleaner-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
